version: '3.8'

services:
  postgres_lakehouse:
    image: postgres:15-alpine
    container_name: postgres_lakehouse
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_lakehouse
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB:-lakehouse_db}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-postgres123}
      MB_DB_HOST: postgres_lakehouse
    depends_on:
      - postgres_lakehouse

volumes:
  postgres_data: